services:
  - type: web
    name: send-bot-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run prisma:generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        fromDatabase:
          name: send-bot-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false

databases:
  - name: send-bot-db
    plan: free
    databaseName: send_bot
    user: send_bot
