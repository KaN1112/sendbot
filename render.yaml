services:
  - type: web
    name: send-bot-web
    runtime: node
    buildCommand: npm ci && npm run prisma:generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: send-bot-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false

  - type: worker
    name: send-bot-worker
    runtime: node
    buildCommand: npm ci
    startCommand: npm run bot
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DISCORD_BOT_TOKEN
        sync: false

databases:
  - name: send-bot-db
    databaseName: send_bot
    user: send_bot
